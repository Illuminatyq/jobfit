services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - jobfit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit -d jobfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      JOBFIT_DATABASE_URL: postgresql+psycopg://jobfit:jobfit@db:5432/jobfit
      JOBFIT_LOG_LEVEL: INFO
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn jobfit.entrypoints.api:app --host 0.0.0.0 --port 8000"

volumes:
  jobfit_pg: