services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit
    ports:
      - "5432:5432"
    volumes:
      - jobfit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit -d jobfit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jobfit_pg: