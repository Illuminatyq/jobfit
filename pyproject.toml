[project]
name = "jobfit"
version = "0.1.0"
description = "Deterministic vacancy-to-profile fit analysis. QA engineering showcase."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobfit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: pure domain tests",
  "property: hypothesis invariants",
  "contract: adapter contracts on recorded fixtures",
  "integration: real Postgres via testcontainers",
  "api: ASGI-level API tests",
  "e2e: Playwright end-to-end",
  "eval: golden dataset quality gates",
  "security: prompt injection corpus",
  "slow: long-running",
  "quarantine: known flaky, excluded from gates",
  "req(id): traceability link to docs/requirements.md",
]

[tool.coverage.run]
source = ["src/jobfit"]
branch = true

[tool.coverage.report]
show_missing = true