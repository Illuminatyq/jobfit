name: docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/illuminatyq/jobfit:latest
            ghcr.io/illuminatyq/jobfit:${{ github.sha }}
      - name: Smoke test image
        run: |
          docker run -d --name jobfit-smoke -p 8000:8000 -e JOBFIT_DATABASE_URL=sqlite:///./demo.db ghcr.io/illuminatyq/jobfit:${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs jobfit-smoke
          test "$ok" = "1"
          docker rm -f jobfit-smoke