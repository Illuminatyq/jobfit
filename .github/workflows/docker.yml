name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
          POSTGRES_DB: jobfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobfit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: |
            ghcr.io/illuminatyq/jobfit:${{ github.sha }}
            ghcr.io/illuminatyq/jobfit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name jobfit-smoke --network host \
            -e JOBFIT_DATABASE_URL=postgresql+psycopg://jobfit:jobfit@localhost:5432/jobfit \
            ghcr.io/illuminatyq/jobfit:${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::healthz не поднялся за 60 секунд"
            docker logs jobfit-smoke
            exit 1
          fi
          echo "healthz ok"
          curl -sf http://localhost:8000/ > /dev/null
          echo "static ok"
          curl -sf -X POST http://localhost:8000/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"vacancy":"Обязательно: Postman, MySQL, Docker.","profile":"Postman, MySQL.","save":true}' \
            > /tmp/analyze.json
          python -c "import json;d=json.load(open('/tmp/analyze.json'));assert d.get('id'),'нет id: запись в БД не прошла, схема не накатилась';print('analyze ok, coverage', d['coverage'])"

      - name: Container logs on failure
        if: failure()
        run: docker logs jobfit-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f jobfit-smoke || true