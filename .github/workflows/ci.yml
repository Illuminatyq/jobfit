name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python scripts/check_syntax.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      - run: python -m jobfit.entrypoints.eval_cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage.xml
            junit.xml
            reports/eval