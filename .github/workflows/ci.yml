name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -m "not integration and not e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  integration:
    runs-on: ubuntu-latest
    needs: [quality, unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobfit
          POSTGRES_PASSWORD: jobfit
          POSTGRES_DB: jobfit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobfit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          JOBFIT_DATABASE_URL: postgresql+psycopg://jobfit:jobfit@localhost:5432/jobfit
      - run: pytest -m integration
        env:
          JOBFIT_DATABASE_URL: postgresql+psycopg://jobfit:jobfit@localhost:5432/jobfit